name: Installer

# Builds the desktop installers (Windows, macOS, Linux) and the standalone server.
# - every push that touches the app: installers downloadable from the run page ("Artifacts")
# - a tag like v0.2.0, or a manual run with "release" set to v0.2.0: also publishes a
#   GitHub Release with all the files (a manual run creates the tag on the built commit)
# Optional repository variable THEVTT_SERVER_URL: server address pre-filled in the app.
on:
  push:
    tags: ['v*']
    branches: ['**']
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - '.github/workflows/installers.yml'
  workflow_dispatch:
    inputs:
      release:
        description: 'Versione da pubblicare (es. v0.2.0). Vuoto = solo build.'
        required: false
        default: ''

concurrency:
  group: installers-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  desktop:
    name: App ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows, os: windows-latest, target: --win }
          - { name: macOS, os: macos-latest, target: --mac }
          - { name: Linux, os: ubuntu-latest, target: --linux }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Versione
        shell: bash
        env:
          RELEASE_INPUT: ${{ inputs.release }}
        run: |
          if [[ -n "$RELEASE_INPUT" ]]; then
            echo "VERSION=${RELEASE_INPUT#v}" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=$(node -p "require('./apps/desktop/package.json').version")" >> "$GITHUB_ENV"
          fi

      - name: Build
        run: pnpm --filter @thevtt/desktop build
        env:
          VITE_THEVTT_SERVER: ${{ vars.THEVTT_SERVER_URL }}

      - name: Installer
        working-directory: apps/desktop
        # bash on every OS: PowerShell would split the dotted -c.extraMetadata argument
        shell: bash
        # signed when the certificates are in the repository secrets (docs/FIRMA.md), unsigned otherwise
        run: |
          if [[ "$RUNNER_OS" == "Windows" && -n "$WIN_CSC_LINK" ]]; then
            export CSC_LINK="$WIN_CSC_LINK" CSC_KEY_PASSWORD="$WIN_CSC_KEY_PASSWORD"
          elif [[ "$RUNNER_OS" == "macOS" && -n "$MAC_CSC_LINK" ]]; then
            export CSC_LINK="$MAC_CSC_LINK" CSC_KEY_PASSWORD="$MAC_CSC_KEY_PASSWORD"
          fi
          if [[ -z "${CSC_LINK:-}" ]]; then
            echo "Nessun certificato: installer non firmati"
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          # notarization (macOS) only with all three Apple values
          if [[ -z "$APPLE_ID" || -z "$APPLE_APP_SPECIFIC_PASSWORD" || -z "$APPLE_TEAM_ID" ]]; then
            unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
          fi
          pnpm exec electron-builder ${{ matrix.target }} --config electron-builder.yml --publish never -c.extraMetadata.version=${{ env.VERSION }}
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - uses: actions/upload-artifact@v4
        with:
          name: TheVTT-${{ matrix.name }}
          if-no-files-found: error
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.dmg
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb

  server:
    name: Server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: pnpm --filter @thevtt/server bundle
      # the web client the server hands to players in a browser (/play/)
      - run: pnpm --filter @thevtt/desktop exec vite build
      - name: Client web
        run: |
          cp -r apps/desktop/out/renderer apps/server/dist/web
          cd apps/server/dist && zip -qr thevtt-web.zip web
      - name: Smoke test
        run: |
          cd apps/server/dist
          PORT=4477 THEVTT_DB=/tmp/smoke.sqlite node thevtt-server.mjs &
          for i in $(seq 1 20); do curl -sf localhost:4477/health && curl -sf localhost:4477/play/ | grep -q '<div id="root">' && exit 0; sleep 0.5; done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: TheVTT-Server
          if-no-files-found: error
          path: |
            apps/server/dist/thevtt-server.mjs
            apps/server/dist/thevtt-web.zip

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.release, 'v')
    needs: [desktop, server]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # the notes shown on the release page and in the app's update prompt
      - uses: actions/checkout@v4
        with:
          sparse-checkout: RELEASE_NOTES.md
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          # on a manual run the tag doesn't exist yet: it is created on the built commit
          tag_name: ${{ inputs.release || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: TheVTT ${{ inputs.release || github.ref_name }}
          files: dist/*
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
