appId: app.thevtt.desktop
productName: TheVTT
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
asar: true
win:
  target: [nsis]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  target: [dmg]
  category: public.app-category.games
linux:
  target: [AppImage, deb]
  category: Game
